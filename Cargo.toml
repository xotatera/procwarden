[package]
name = "procwarden"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-only"
default-run = "procwarden"
autobenches = false
description = "TUI process manager for Windows — monitor, control, and auto-throttle CPU hogs"
repository = "https://github.com/xotatera/procwarden"
homepage = "https://github.com/xotatera/procwarden"
readme = "README.md"
keywords = ["process-manager", "tui", "windows", "etw", "priority"]
categories = ["command-line-utilities", "os::windows-apis"]

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
sysinfo = "0.31"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
log = "0.4"
env_logger = "0.11"
windows = { version = "0.48", features = [
    "Win32_System_Diagnostics_Etw",
    "Win32_Foundation",
    "Win32_System_Time",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Diagnostics_ToolHelp",
], optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

[features]
# no default features, ETW can be enabled explicitly
default = ["etw"]
etw = ["windows"]

[[bin]]
name = "cpu_comparison"
path = "benches/cpu_comparison.rs"

[[bin]]
name = "pg_config_sweep"
path = "benches/pg_config_sweep.rs"

[[bench]]
name = "process_pipeline"
harness = false
