name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: Compress-Archive -Path target/release/procwarden.exe -DestinationPath procwarden-${{ github.ref_name }}-x86_64-windows.zip
        shell: pwsh
      - uses: softprops/action-gh-release@v2
        with:
          files: procwarden-${{ github.ref_name }}-x86_64-windows.zip
          generate_release_notes: true
